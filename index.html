<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown SPM 2026</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

<style>

/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    font-family: "Baloo 2", sans-serif;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(0, 183, 255, 0.78),
            rgba(76, 0, 255, 0.68),
            rgba(255, 80, 180, 0.55)
        ),
        url("school.jpg") center / cover fixed no-repeat;

    overflow-x: hidden;
}


/* =========================================
   DECORATIVE BACKGROUND
========================================= */

.background-decoration {
    position: fixed;
    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.circle {
    position: absolute;

    border-radius: 50%;

    filter: blur(2px);

    opacity: 0.35;

    animation: float 8s ease-in-out infinite;
}

.circle.one {
    width: 180px;
    height: 180px;

    background: #ffd93d;

    top: 5%;
    left: -50px;
}

.circle.two {
    width: 130px;
    height: 130px;

    background: #ff6bcb;

    top: 30%;
    right: -30px;

    animation-delay: 1s;
}

.circle.three {
    width: 220px;
    height: 220px;

    background: #6bffb8;

    bottom: 10%;
    left: -80px;

    animation-delay: 2s;
}

.circle.four {
    width: 150px;
    height: 150px;

    background: #ff9f43;

    bottom: 30%;
    right: -50px;

    animation-delay: 3s;
}

@keyframes float {

    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-30px) rotate(15deg);
    }
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {

    position: relative;

    z-index: 1;

    width: 100%;

    max-width: 900px;

    margin: auto;

    padding: 30px 20px 70px;

    text-align: center;
}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    flex-direction: column;

    align-items: center;

    animation: fadeDown 1s ease;
}

@keyframes fadeDown {

    from {
        opacity: 0;
        transform: translateY(-30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================
   SCHOOL LOGO
========================================= */

.logo-container {

    width: 145px;
    height: 145px;

    background: rgba(255,255,255,0.95);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 12px;

    margin-bottom: 18px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.35),
        0 0 0 6px rgba(255,255,255,0.25);

    animation: logoFloat 4s ease-in-out infinite;
}

.logo-container img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    border-radius: 50%;
}

@keyframes logoFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =========================================
   TITLE
========================================= */

.header h1 {

    font-family: "Pacifico", cursive;

    font-size: clamp(25px, 5vw, 42px);

    line-height: 1.3;

    text-shadow:
        3px 4px 0 rgba(0,0,0,0.25),
        0 4px 15px rgba(0,0,0,0.3);

    margin-bottom: 5px;
}

.header h2 {

    font-family: "Pacifico", cursive;

    font-size: clamp(38px, 7vw, 62px);

    line-height: 1.2;

    background: linear-gradient(
        90deg,
        #fff,
        #ffe66d,
        #fff
    );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    filter: drop-shadow(3px 4px 2px rgba(0,0,0,0.35));
}


/* =========================================
   SCHEDULE TITLE
========================================= */

.schedule-title {

    display: inline-block;

    font-family: "Pacifico", cursive;

    font-size: clamp(27px, 5vw, 40px);

    margin: 35px 0 45px;

    padding: 8px 25px;

    background: rgba(255,255,255,0.16);

    border-radius: 30px;

    border: 2px solid rgba(255,255,255,0.5);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.2),
        inset 0 0 20px rgba(255,255,255,0.1);

    text-shadow: 3px 3px 3px rgba(0,0,0,0.35);
}


/* =========================================
   COUNTDOWN SECTION
========================================= */

.countdown-section {

    margin-bottom: 45px;

    animation: fadeUp 0.8s ease both;
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================
   EXAM TITLES
========================================= */

.exam-name {

    font-family: "Pacifico", cursive;

    font-size: clamp(25px, 5vw, 39px);

    line-height: 1.3;

    margin-bottom: 18px;

    color: white;

    text-shadow:
        3px 3px 0 rgba(0,0,0,0.35),
        0 5px 10px rgba(0,0,0,0.3);
}


/* =========================================
   COUNTDOWN BOX
========================================= */

.countdown {

    width: 100%;

    max-width: 520px;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 8px;

    padding: 18px;

    border-radius: 25px;

    background: rgba(255,255,255,0.17);

    border: 2px solid rgba(255,255,255,0.45);

    backdrop-filter: blur(10px);

    box-shadow:
        0 15px 35px rgba(0,0,0,0.25),
        inset 0 0 25px rgba(255,255,255,0.08);

    transition: transform 0.3s ease;
}

.countdown:hover {

    transform: translateY(-5px) scale(1.015);

}


/* =========================================
   TIME NUMBERS
========================================= */

.time {

    font-size: clamp(30px, 6vw, 55px);

    font-weight: 700;

    line-height: 1;

    color: white;

    text-shadow:
        2px 3px 0 rgba(0,0,0,0.25);
}


/* =========================================
   LABELS
========================================= */

.label {

    margin-top: 9px;

    font-size: clamp(10px, 2vw, 14px);

    font-weight: 600;

    letter-spacing: 1px;

    opacity: 0.95;
}


/* =========================================
   DIFFERENT COUNTDOWN COLOURS
========================================= */

.countdown-section:nth-of-type(1) .countdown {

    background:
        linear-gradient(
            135deg,
            rgba(255, 105, 180, 0.45),
            rgba(255, 77, 109, 0.35)
        );
}

.countdown-section:nth-of-type(2) .countdown {

    background:
        linear-gradient(
            135deg,
            rgba(255, 193, 7, 0.45),
            rgba(255, 152, 0, 0.35)
        );
}

.countdown-section:nth-of-type(3) .countdown {

    background:
        linear-gradient(
            135deg,
            rgba(0, 230, 118, 0.45),
            rgba(0, 188, 212, 0.35)
        );
}

.countdown-section:nth-of-type(4) .countdown {

    background:
        linear-gradient(
            135deg,
            rgba(156, 39, 176, 0.45),
            rgba(63, 81, 181, 0.35)
        );
}

.countdown-section:nth-of-type(5) .countdown {

    background:
        linear-gradient(
            135deg,
            rgba(0, 188, 212, 0.45),
            rgba(3, 169, 244, 0.35)
        );
}

.countdown-section:nth-of-type(6) .countdown {

    background:
        linear-gradient(
            135deg,
            rgba(255, 87, 34, 0.45),
            rgba(233, 30, 99, 0.35)
        );
}


/* =========================================
   STATUS
========================================= */

.status {

    display: none;

    margin-top: 12px;

    font-family: "Pacifico", cursive;

    font-size: 21px;

    color: #ffe66d;

    text-shadow: 2px 2px 3px rgba(0,0,0,0.4);
}


/* =========================================
   FOOTER
========================================= */

.footer {

    margin-top: 60px;

    padding: 12px 20px;

    display: inline-block;

    background: rgba(255,255,255,0.12);

    border-radius: 30px;

    font-size: 14px;

    opacity: 0.9;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .container {
        padding: 25px 12px 50px;
    }

    .logo-container {

        width: 110px;
        height: 110px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header h2 {
        font-size: 36px;
    }

    .schedule-title {
        font-size: 26px;

        margin-top: 28px;
        margin-bottom: 35px;

        padding: 7px 18px;
    }

    .exam-name {
        font-size: 25px;
    }

    .countdown {

        padding: 14px 6px;

        gap: 2px;

        border-radius: 20px;
    }

    .time {
        font-size: 28px;
    }

    .label {
        font-size: 9px;
        letter-spacing: 0;
    }
}


/* =========================================
   VERY SMALL PHONES
========================================= */

@media (max-width: 350px) {

    .time {
        font-size: 23px;
    }

    .exam-name {
        font-size: 22px;
    }

    .header h1 {
        font-size: 21px;
    }

    .header h2 {
        font-size: 31px;
    }
}

</style>
</head>


<body>


<!-- Background Decorations -->

<div class="background-decoration">

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
    <div class="circle four"></div>

</div>



<div class="container">


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="logo-container">

        <img
            src="logo.png"
            alt="Logo sekolah"
        >

    </div>


    <h1>
        Unit Bimbingan Kaunseling SMK Saujana Indah
    </h1>

    <h2>
        Countdown SPM 2026
    </h2>

</header>



<!-- =========================================
     SCHEDULE TITLE
========================================= -->

<h2 class="schedule-title">
    Jadual Peperiksaan SPM
</h2>



<!-- =========================================
     BM BERTUTUR
========================================= -->

<section class="countdown-section">

    <h3 class="exam-name">
        Ujian Bertutur Bahasa Melayu
    </h3>

    <div
        class="countdown"
        data-date="2026-10-26T08:00:00+08:00"
    ></div>

    <div class="status"></div>

</section>



<!-- =========================================
     BI BERTUTUR
========================================= -->

<section class="countdown-section">

    <h3 class="exam-name">
        Ujian Bertutur Bahasa Inggeris
    </h3>

    <div
        class="countdown"
        data-date="2026-11-02T08:00:00+08:00"
    ></div>

    <div class="status"></div>

</section>



<!-- =========================================
     AMALI SAINS
========================================= -->

<section class="countdown-section">

    <h3 class="exam-name">
        Ujian Amali Sains
    </h3>

    <div
        class="countdown"
        data-date="2026-11-16T08:05:00+08:00"
    ></div>

    <div class="status"></div>

</section>



<!-- =========================================
     BM MENDENGAR
========================================= -->

<section class="countdown-section">

    <h3 class="exam-name">
        Ujian Mendengar Bahasa Melayu
    </h3>

    <div
        class="countdown"
        data-date="2026-11-23T09:00:00+08:00"
    ></div>

    <div class="status"></div>

</section>



<!-- =========================================
     BI MENDENGAR
========================================= -->

<section class="countdown-section">

    <h3 class="exam-name">
        Ujian Mendengar Bahasa Inggeris
    </h3>

    <div
        class="countdown"
        data-date="2026-11-24T09:00:00+08:00"
    ></div>

    <div class="status"></div>

</section>



<!-- =========================================
     WRITTEN EXAMINATION
========================================= -->

<section class="countdown-section">

    <h3 class="exam-name">
        Peperiksaan Bertulis
    </h3>

    <div
        class="countdown"
        data-date="2026-11-23T10:45:00+08:00"
    ></div>

    <div class="status"></div>

</section>



<div class="footer">
    ✨ Semoga berjaya dalam SPM 2026! ✨
</div>


</div>



<script>

/* =========================================
   CREATE COUNTDOWN
========================================= */

function createCountdown(box) {

    box.innerHTML = `

        <div>
            <div class="time days">00</div>
            <div class="label">HARI</div>
        </div>

        <div>
            <div class="time hours">00</div>
            <div class="label">JAM</div>
        </div>

        <div>
            <div class="time minutes">00</div>
            <div class="label">MINIT</div>
        </div>

        <div>
            <div class="time seconds">00</div>
            <div class="label">SAAT</div>
        </div>

    `;
}


/* =========================================
   UPDATE COUNTDOWNS
========================================= */

function updateCountdowns() {

    document
        .querySelectorAll(".countdown")
        .forEach(box => {

            const target =
                new Date(box.dataset.date).getTime();

            const now =
                Date.now();

            const difference =
                target - now;

            const status =
                box.nextElementSibling;


            /* Exam started */

            if (difference <= 0) {

                box.querySelector(".days").textContent = "00";
                box.querySelector(".hours").textContent = "00";
                box.querySelector(".minutes").textContent = "00";
                box.querySelector(".seconds").textContent = "00";

                status.textContent =
                    "🎉 Peperiksaan telah bermula!";

                status.style.display = "block";

                return;
            }


            /* Calculate time */

            const days =
                Math.floor(
                    difference / 86400000
                );

            const hours =
                Math.floor(
                    (difference / 3600000) % 24
                );

            const minutes =
                Math.floor(
                    (difference / 60000) % 60
                );

            const seconds =
                Math.floor(
                    (difference / 1000) % 60
                );


            /* Display */

            box.querySelector(".days")
                .textContent =
                String(days).padStart(2, "0");

            box.querySelector(".hours")
                .textContent =
                String(hours).padStart(2, "0");

            box.querySelector(".minutes")
                .textContent =
                String(minutes).padStart(2, "0");

            box.querySelector(".seconds")
                .textContent =
                String(seconds).padStart(2, "0");

        });
}


/* =========================================
   START
========================================= */

document
    .querySelectorAll(".countdown")
    .forEach(createCountdown);


updateCountdowns();


/* Update every second */

setInterval(
    updateCountdowns,
    1000
);

</script>


</body>
</html>


</body>

</html>
